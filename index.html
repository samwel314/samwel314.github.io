<script>
  Blazor.start({
    loadBootResource: function (type, name, defaultUri, integrity) {

    <script>
        window.generateProfessionalCard = async (name, message, templatePath) => {
            return new Promise(async (resolve, reject) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.src = templatePath;

                await Promise.all([
                    img.decode(),
                    document.fonts.ready
                ]).catch(() => reject("فشل في تحميل الموارد"));

                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                let nX, nY, mX, mY, nColor, mColor, nSize, mSize, textAlign;


                if (templatePath.includes("temp1.png")) {
                    textAlign = "left";
                    nX = 35; nY = 560;
                    mX = 35; mY = 610;
                    nColor = "#FFD700"; // ذهبي منور
                    mColor = "#FFFFFF"; // أبيض ناصع
                    nSize = 65; mSize = 45;
                }
                else if (templatePath.includes("temp2.png")) {
                    textAlign = "center";
                    nX = canvas.width / 2; nY = 1192;
                    mX = nX; mY = 1242;
                    nColor = "#D21F3C"; // أحمر ملكي
                    mColor = "#4A4A4A"; // رمادي غامق شيك
                    nSize = 65; mSize = 45;
                }
                else if (templatePath.includes("temp3.png")) {
                    textAlign = "center";
                    nX = canvas.width / 2; nY = 960;
                    mX = nX; mY = 1010;
                    nColor = "#FFFFFF"; // أبيض عشان يبان على الصخر الغامق
                    mColor = "#FFD700"; // ذهبي للرسالة
                    nSize = 65; mSize = 45;
                }
                else if (templatePath.includes("temp4.png")) {
                    textAlign = "center";
                    nX = canvas.width / 2; nY = 774;
                    mX = nX; mY = 824;
                    nColor = "#B22222"; // أحمر طوبي يليق بالرسم اليدوي
                    mColor = "#FFD700"; // أسود خفيف
                    nSize = 65; mSize = 45;
                }

                ctx.textAlign = textAlign;

                ctx.font = `bold ${nSize}px 'UncialAntiqua', serif`;
                ctx.fillStyle = nColor;
                ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 5;
                ctx.fillText(name, nX, nY);

                ctx.font = `italic ${mSize}px Arial, sans-serif`;
                ctx.fillStyle = mColor;
                ctx.shadowBlur = 5; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                ctx.fillText(message, mX, mY);

                resolve(canvas.toDataURL("image/png"));
            });
        };

    </script>
