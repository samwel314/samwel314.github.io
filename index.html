<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HappyEaster</title>
    
    <!-- الـ Base href أساسي عشان المسارات -->
    <base href="/" />

    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HappyEaster.styles.css" rel="stylesheet" />

    <!-- تم حذف الـ importmap لأنها سبب الـ Integrity Error على GitHub -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- 1. استدعاء ملف بليزور الرئيسي (بالاسم المشفر اللي عندك) -->
    <script src="_framework/blazor.webassembly.66stpp682q.js" autostart="false"></script>

    <!-- 2. تشغيل بليزور يدوياً وتخطي فحص الـ Integrity -->
    <script>
        if (window.Blazor) {
            Blazor.start({
                loadBootResource: function (type, name, defaultUri, integrity) {
                    // ده السطر اللي بيحل مشكلة Failed to find a valid digest
                    return defaultUri;
                }
            });
        }
    </script>

    <!-- 3. الكود الخاص بيك لتوليد الكروت -->
    <script>
        window.generateProfessionalCard = async (name, message, templatePath) => {
            return new Promise(async (resolve, reject) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.src = templatePath;

                await Promise.all([
                    img.decode(),
                    document.fonts.ready
                ]).catch(() => reject("فشل في تحميل الموارد"));

                canvas.width = img.width;
                canvas.height = img.height;
                ctx.drawImage(img, 0, 0);

                let nX, nY, mX, mY, nColor, mColor, nSize, mSize, textAlign;

                if (templatePath.includes("temp1.png")) {
                    textAlign = "left";
                    nX = 35; nY = 560;
                    mX = 35; mY = 610;
                    nColor = "#FFD700"; 
                    mColor = "#FFFFFF"; 
                    nSize = 65; mSize = 45;
                }
                else if (templatePath.includes("temp2.png")) {
                    textAlign = "center";
                    nX = canvas.width / 2; nY = 1192;
                    mX = nX; mY = 1242;
                    nColor = "#D21F3C"; 
                    mColor = "#4A4A4A"; 
                    nSize = 65; mSize = 45;
                }
                else if (templatePath.includes("temp3.png")) {
                    textAlign = "center";
                    nX = canvas.width / 2; nY = 960;
                    mX = nX; mY = 1010;
                    nColor = "#FFFFFF"; 
                    mColor = "#FFD700"; 
                    nSize = 65; mSize = 45;
                }
                else if (templatePath.includes("temp4.png")) {
                    textAlign = "center";
                    nX = canvas.width / 2; nY = 774;
                    mX = nX; mY = 824;
                    nColor = "#B22222"; 
                    mColor = "#FFD700"; 
                    nSize = 65; mSize = 45;
                }

                ctx.textAlign = textAlign;
                ctx.font = `bold ${nSize}px 'UncialAntiqua', serif`;
                ctx.fillStyle = nColor;
                ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
                ctx.shadowBlur = 15;
                ctx.shadowOffsetX = 5; ctx.shadowOffsetY = 5;
                ctx.fillText(name, nX, nY);

                ctx.font = `italic ${mSize}px Arial, sans-serif`;
                ctx.fillStyle = mColor;
                ctx.shadowBlur = 5; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
                ctx.fillText(message, mX, mY);

                resolve(canvas.toDataURL("image/png"));
            });
        };
    </script>
</body>

</html>
